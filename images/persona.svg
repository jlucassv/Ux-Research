<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<rect width="1000" height="700" fill="#f6f7fb"/><rect x="45" y="45" width="910" height="610" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/>
<rect x="45" y="45" width="910" height="145" rx="24" fill="#23395d"/><rect x="45" y="160" width="910" height="30" fill="#23395d"/>
<circle cx="135" cy="117" r="48" fill="#d9e7ff"/><circle cx="135" cy="101" r="17" fill="#6287bd"/><path d="M102 143 Q135 108 168 143" fill="#6287bd"/>
<g font-family="Arial"><text x="205" y="105" font-size="34" font-weight="700" fill="#fff">Marina Costa</text><text x="205" y="140" font-size="19" fill="#e3ebf8">Persona • Praticidade e previsibilidade</text>
<text x="85" y="240" font-size="23" font-weight="700" fill="#23395d">Objetivo</text><text x="85" y="273" font-size="18" fill="#354052">Escolher uma refeição rapidamente, conhecer o preço total</text><text x="85" y="299" font-size="18" fill="#354052">e acompanhar a entrega com confiança.</text>
<text x="85" y="355" font-size="23" font-weight="700" fill="#23395d">Motivações</text><text x="85" y="388" font-size="18" fill="#354052">• Economizar tempo</text><text x="85" y="418" font-size="18" fill="#354052">• Comparar preço e prazo</text><text x="85" y="448" font-size="18" fill="#354052">• Consultar avaliações confiáveis</text>
<text x="540" y="355" font-size="23" font-weight="700" fill="#23395d">Frustrações</text><text x="540" y="388" font-size="18" fill="#354052">• Taxas descobertas no fim</text><text x="540" y="418" font-size="18" fill="#354052">• Informações espalhadas</text><text x="540" y="448" font-size="18" fill="#354052">• Status de entrega pouco claro</text>
<rect x="85" y="500" width="830" height="100" rx="16" fill="#eaf1fc"/><text x="110" y="540" font-size="20" font-style="italic" fill="#23395d">“Quero escolher rápido, saber quanto vou pagar</text><text x="110" y="570" font-size="20" font-style="italic" fill="#23395d">e não precisar adivinhar onde está meu pedido.”</text>
<text x="85" y="630" font-size="14" fill="#778196">Persona ilustrativa para orientar o exercício; validar com pesquisa real.</text></g></svg>
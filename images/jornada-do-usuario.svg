<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#f6f7fb"/><text x="50" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#172033">Jornada do usuário — Pedido por delivery</text>
<text x="50" y="94" font-family="Arial" font-size="17" fill="#596579">Etapas, sentimentos, dificuldades e oportunidades de melhoria</text>
<g font-family="Arial">
<g transform="translate(40,135)"><rect width="205" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="205" height="65" rx="16" fill="#dce9ff"/><rect y="48" width="205" height="17" fill="#dce9ff"/><text x="18" y="40" font-size="20" font-weight="700" fill="#244b83">1. Início</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Abre o app e</text><text x="18" y="153" font-size="15" fill="#46536a">procura refeição.</text><text x="18" y="198" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="225" font-size="15" fill="#46536a">Quer resolver</text><text x="18" y="246" font-size="15" fill="#46536a">rapidamente.</text><text x="18" y="291" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="318" font-size="15" fill="#46536a">Muitas opções.</text><text x="18" y="365" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="392" font-size="15" fill="#46536a">Filtros e categorias</text><text x="18" y="413" font-size="15" fill="#46536a">relevantes.</text></g>
<g transform="translate(265,135)"><rect width="205" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="205" height="65" rx="16" fill="#dff4e8"/><rect y="48" width="205" height="17" fill="#dff4e8"/><text x="18" y="40" font-size="20" font-weight="700" fill="#216746">2. Exploração</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Consulta fotos,</text><text x="18" y="153" font-size="15" fill="#46536a">notas e prazo.</text><text x="18" y="198" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="225" font-size="15" fill="#46536a">Compara opções.</text><text x="18" y="270" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="297" font-size="15" fill="#46536a">Dados espalhados</text><text x="18" y="318" font-size="15" fill="#46536a">em várias telas.</text><text x="18" y="365" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="392" font-size="15" fill="#46536a">Exibição consistente</text><text x="18" y="413" font-size="15" fill="#46536a">de nota, preço e prazo.</text></g>
<g transform="translate(490,135)"><rect width="205" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="205" height="65" rx="16" fill="#fff0dc"/><rect y="48" width="205" height="17" fill="#fff0dc"/><text x="18" y="40" font-size="20" font-weight="700" fill="#8b5716">3. Decisão</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Seleciona prato e</text><text x="18" y="153" font-size="15" fill="#46536a">confere carrinho.</text><text x="18" y="198" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="225" font-size="15" fill="#46536a">Quer saber o total.</text><text x="18" y="270" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="297" font-size="15" fill="#46536a">Taxas aparecem</text><text x="18" y="318" font-size="15" fill="#46536a">tarde.</text><text x="18" y="365" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="392" font-size="15" fill="#46536a">Mostrar estimativa</text><text x="18" y="413" font-size="15" fill="#46536a">do custo completo.</text></g>
<g transform="translate(715,135)"><rect width="205" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="205" height="65" rx="16" fill="#e9e0ff"/><rect y="48" width="205" height="17" fill="#e9e0ff"/><text x="18" y="40" font-size="20" font-weight="700" fill="#68449a">4. Confirmação</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Confere endereço,</text><text x="18" y="153" font-size="15" fill="#46536a">itens e pagamento.</text><text x="18" y="198" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="225" font-size="15" fill="#46536a">Busca segurança.</text><text x="18" y="270" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="297" font-size="15" fill="#46536a">Dúvidas no resumo</text><text x="18" y="318" font-size="15" fill="#46536a">do pedido.</text><text x="18" y="365" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="392" font-size="15" fill="#46536a">Resumo final claro</text><text x="18" y="413" font-size="15" fill="#46536a">antes de confirmar.</text></g>
<g transform="translate(940,135)"><rect width="205" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="205" height="65" rx="16" fill="#ffe4e4"/><rect y="48" width="205" height="17" fill="#ffe4e4"/><text x="18" y="40" font-size="20" font-weight="700" fill="#9a3434">5. Acompanhamento</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Consulta o status.</text><text x="18" y="177" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="204" font-size="15" fill="#46536a">Quer saber quando</text><text x="18" y="225" font-size="15" fill="#46536a">o pedido chega.</text><text x="18" y="270" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="297" font-size="15" fill="#46536a">Status vago ou</text><text x="18" y="318" font-size="15" fill="#46536a">sem atualização.</text><text x="18" y="365" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="392" font-size="15" fill="#46536a">Previsão atualizada</text><text x="18" y="413" font-size="15" fill="#46536a">e aviso de atraso.</text></g>
<g transform="translate(1165,135)"><rect width="195" height="490" rx="16" fill="#fff" stroke="#d6deea" stroke-width="2"/><rect width="195" height="65" rx="16" fill="#dce9ff"/><rect y="48" width="195" height="17" fill="#dce9ff"/><text x="18" y="40" font-size="20" font-weight="700" fill="#244b83">6. Pós-entrega</text><text x="18" y="105" font-size="16" font-weight="700" fill="#26364d">Ação</text><text x="18" y="132" font-size="15" fill="#46536a">Recebe e avalia.</text><text x="18" y="177" font-size="16" font-weight="700" fill="#26364d">Sentimento</text><text x="18" y="204" font-size="15" fill="#46536a">Decide se repetiria.</text><text x="18" y="249" font-size="16" font-weight="700" fill="#26364d">Dificuldade</text><text x="18" y="276" font-size="15" fill="#46536a">Repetir exige nova</text><text x="18" y="297" font-size="15" fill="#46536a">busca.</text><text x="18" y="344" font-size="16" font-weight="700" fill="#216746">Oportunidade</text><text x="18" y="371" font-size="15" fill="#46536a">Histórico e opção</text><text x="18" y="392" font-size="15" fill="#46536a">de repetir pedido.</text></g>
</g></svg>